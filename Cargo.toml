[package]
name = "rivet"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { version = "=0.7.20", default-features = false, features = ["rt"] }
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = { version = "=1.1.8", default-features = false, features = ["std", "serde", "parse"] }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "backup"] }
libsqlite3-sys = { version = "=0.39.1", default-features = false }
cap-std = "=4.0.3"
thiserror = "=2.0.21"
uuid = { version = "=1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rivet"
path = "src/main.rs"
